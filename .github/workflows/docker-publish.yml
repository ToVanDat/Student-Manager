name: Build and publish Student-Manager images

on:
  push:
    branches:
      - feature/chat-1to1-complete
    paths:
      - "students_management-frontend/**"
      - "students_managerment-api/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./students_management-frontend
          file: ./students_management-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/tovandat/student-manager-frontend:feature-chat-1to1-complete
            ghcr.io/tovandat/student-manager-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./students_managerment-api
          file: ./students_managerment-api/Dockerfile
          push: true
          tags: |
            ghcr.io/tovandat/student-manager-api:feature-chat-1to1-complete
            ghcr.io/tovandat/student-manager-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

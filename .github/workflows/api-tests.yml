name: API tests

on:
  push:
    branches:
      - main
      - feature/chat-1to1-complete
  pull_request:
    branches:
      - main
      - feature/chat-1to1-complete
  workflow_dispatch:

jobs:
  e2ee-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2ee_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e2ee_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create minimal base-schema fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE users (id BIGSERIAL PRIMARY KEY);
          CREATE TABLE conversations (id BIGSERIAL PRIMARY KEY);
          CREATE TABLE messages (id BIGSERIAL PRIMARY KEY);
          SQL
      - name: Apply E2EE migration twice (idempotency smoke test)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_foundation_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_foundation_migration.sql

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students_managerment-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Run API unit tests
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students_management-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

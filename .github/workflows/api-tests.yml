name: API tests

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - feature/chat-1to1-complete
      - feature/e2ee-foundation
      - feature/face-login-hardening
  pull_request:
    branches:
      - main
      - feature/chat-1to1-complete
      - feature/e2ee-foundation
      - feature/face-login-hardening
  workflow_dispatch:

jobs:
  e2ee-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2ee_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e2ee_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create minimal base-schema fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE users (id BIGSERIAL PRIMARY KEY);
          CREATE TABLE sessions (id UUID PRIMARY KEY, user_id BIGINT NOT NULL REFERENCES users(id));
          CREATE TABLE conversations (id BIGSERIAL PRIMARY KEY, type TEXT NOT NULL DEFAULT 'direct');
          CREATE TABLE messages (id BIGSERIAL PRIMARY KEY);
          CREATE TABLE conversation_members (
            conversation_id BIGINT NOT NULL REFERENCES conversations(id) ON DELETE CASCADE,
            user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            left_at TIMESTAMPTZ,
            PRIMARY KEY (conversation_id, user_id)
          );
          SQL
      - name: Apply E2EE migration twice (idempotency smoke test)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_foundation_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_foundation_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_attachment_objects_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_attachment_objects_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_attachment_retry_identity_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_attachment_retry_identity_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_provisioning_proof_v1_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/e2ee_provisioning_proof_v1_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/advanced_auth_features_migration.sql
          psql -h localhost -U postgres -d e2ee_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/advanced_auth_features_migration.sql

  student-account-link-migration-smoke:
    name: Student account-link migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_link_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_link_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create minimal application schema fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d student_link_migration_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE users (
            id BIGSERIAL PRIMARY KEY,
            username TEXT,
            full_name TEXT,
            email TEXT,
            role TEXT NOT NULL,
            is_active BOOLEAN NOT NULL DEFAULT TRUE
          );
          CREATE TABLE students (id BIGSERIAL PRIMARY KEY);
          CREATE TABLE permissions (
            permission_key TEXT PRIMARY KEY,
            module_key TEXT NOT NULL,
            label_vi TEXT NOT NULL,
            label_en TEXT NOT NULL,
            description_vi TEXT NOT NULL DEFAULT '',
            description_en TEXT NOT NULL DEFAULT '',
            is_sensitive BOOLEAN NOT NULL DEFAULT FALSE
          );
          CREATE TABLE role_permissions (
            role TEXT NOT NULL,
            permission_key TEXT NOT NULL REFERENCES permissions(permission_key),
            allowed BOOLEAN NOT NULL DEFAULT FALSE,
            updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (role, permission_key)
          );
          INSERT INTO users (username, full_name, email, role)
          VALUES ('admin-smoke', 'Admin Smoke', 'admin-smoke@example.invalid', 'admin'),
                 ('student-smoke', 'Student Smoke', 'student-smoke@example.invalid', 'user');
          INSERT INTO students DEFAULT VALUES;
          SQL
      - name: Apply base and workflow migrations (workflow migration idempotency)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d student_link_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/student_account_link_schema_migration.sql
          psql -h localhost -U postgres -d student_link_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/student_account_link_admin_workflow_migration.sql
          psql -h localhost -U postgres -d student_link_migration_test -v ON_ERROR_STOP=1 -f students_managerment-api/sql/student_account_link_admin_workflow_migration.sql
          psql -h localhost -U postgres -d student_link_migration_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO student_account_links
            (user_id, student_id, verified_at, verified_by, verification_method, verification_note)
          VALUES (2, 1, CURRENT_TIMESTAMP, 1, 'admin_manual_review', 'Verified against registrar records');
          INSERT INTO student_account_link_audit
            (action, user_id, student_id, actor_user_id, verification_method, note)
          VALUES ('linked', '2', '1', '1', 'admin_manual_review', 'Verified against registrar records');
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM role_permissions
              WHERE role = 'admin' AND permission_key = 'students.link_accounts' AND allowed = TRUE
            ) THEN RAISE EXCEPTION 'admin link permission was not seeded'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM role_permissions
              WHERE role = 'user' AND permission_key = 'students.link_accounts' AND allowed = FALSE
            ) THEN RAISE EXCEPTION 'user link permission must remain denied'; END IF;
            IF (SELECT COUNT(*) FROM student_account_links) <> 1 THEN
              RAISE EXCEPTION 'expected exactly one verified account link';
            END IF;
            IF (SELECT COUNT(*) FROM student_account_link_audit) <> 1 THEN
              RAISE EXCEPTION 'expected one audit event';
            END IF;
            BEGIN
              DELETE FROM students WHERE id = 1;
              RAISE EXCEPTION 'deleting a linked student must be blocked';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;
            BEGIN
              DELETE FROM users WHERE id = 2;
              RAISE EXCEPTION 'deleting a linked user must be blocked';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;
            IF (SELECT COUNT(*) FROM student_account_links) <> 1 THEN
              RAISE EXCEPTION 'linked mapping must survive rejected parent deletion';
            END IF;
            IF (SELECT COUNT(*) FROM student_account_link_audit) <> 1 THEN
              RAISE EXCEPTION 'audit event must survive rejected parent deletion';
            END IF;
            BEGIN
              UPDATE student_account_link_audit SET note = 'tampered' WHERE id = 1;
              RAISE EXCEPTION 'audit UPDATE must be blocked';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
            BEGIN
              DELETE FROM student_account_link_audit WHERE id = 1;
              RAISE EXCEPTION 'audit DELETE must be blocked';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
            BEGIN
              TRUNCATE student_account_link_audit;
              RAISE EXCEPTION 'audit TRUNCATE must be blocked';
            EXCEPTION WHEN SQLSTATE '55000' THEN
              NULL;
            END;
            IF (SELECT COUNT(*) FROM student_account_link_audit) <> 1
               OR (SELECT note FROM student_account_link_audit WHERE id = 1) <> 'Verified against registrar records' THEN
              RAISE EXCEPTION 'audit history must remain unchanged after rejected mutations';
            END IF;
          END $verify$;
          SQL

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students_managerment-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Install and lock Face Login ONNX Runtime
        run: npm install --save-exact onnxruntime-node@1.30.0 --no-audit --no-fund
      - name: Install Linux sharp runtime omitted from the cross-platform lockfile
        run: npm install --no-save --package-lock=false --include=optional sharp@0.34.5
      - name: Verify Face Login ONNX Runtime native module loads
        run: node -e "require('onnxruntime-node'); console.log('[Face Login] ONNX Runtime native module loaded')"
      - name: Run API unit tests
        run: npm test
      - name: Run Cloudflare R2 Worker tests
        run: node --test cloudflare/e2ee-r2-worker/test/worker.test.js
      - name: Commit npm-generated Face Login dependency lock
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add students_managerment-api/package.json students_managerment-api/package-lock.json
          if git -C .. diff --cached --quiet; then
            echo "No dependency lock changes to commit."
          else
            git -C .. commit -m "deps(face-auth): commit npm-generated ONNX Runtime lock [skip ci]"
            git -C .. push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students_management-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: E2EE protocol round-trip tests
        run: npm run test:e2ee
      - name: Build frontend
        run: npm run build


  e2ee-relay-postgres-integration:
    name: E2EE relay live PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2ee_relay_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e2ee_relay_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: students_managerment-api
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: e2ee_relay_integration
      DB_USER: postgres
      DB_PASSWORD: postgres
      E2EE_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Run live PostgreSQL relay integration test
        run: node --test test/e2eeRelayPostgres.integration.test.js

  face-auth-postgres-integration:
    name: Face Login PostgreSQL session guard integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: face_auth_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d face_auth_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: students_managerment-api
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: face_auth_integration
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      FACE_AUTH_DB_INTEGRATION: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Install Linux sharp runtime omitted from the cross-platform lockfile
        run: npm install --no-save --package-lock=false --include=optional sharp@0.34.5
      - name: Create isolated Face Login integration schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d face_auth_integration -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE users (
            id BIGSERIAL PRIMARY KEY,
            is_active BOOLEAN NOT NULL DEFAULT TRUE
          );
          CREATE TABLE user_face_credentials (
            id BIGSERIAL PRIMARY KEY,
            user_id BIGINT NOT NULL UNIQUE REFERENCES users(id) ON DELETE CASCADE,
            ciphertext BYTEA NOT NULL,
            nonce BYTEA NOT NULL,
            auth_tag BYTEA NOT NULL,
            key_version SMALLINT NOT NULL,
            model_id TEXT NOT NULL,
            model_version TEXT NOT NULL,
            disabled_at TIMESTAMPTZ
          );
          CREATE TABLE sessions (
            id UUID PRIMARY KEY,
            user_id BIGINT NOT NULL REFERENCES users(id),
            device_name VARCHAR(100),
            user_agent TEXT,
            ip_address TEXT
          );
          SQL
      - name: Run Face Login PostgreSQL integration test
        run: node --test test/faceSessionGuard.integration.test.js
      - name: Run Face Login Redis enrollment-lock integration test
        run: node --test test/faceEnrollmentLock.integration.test.js

name: PostgreSQL backup and isolated restore smoke

on:
  push:
    branches: [main, feature/chat-1to1-complete, fix/password-cooldown-ip-guard]
  pull_request:
    branches: [main, feature/chat-1to1-complete]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore-smoke:
    name: Backup archive and isolated PostgreSQL restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backup_restore_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backup_restore_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable source database fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d backup_restore_source -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE backup_fixture (
            id BIGINT PRIMARY KEY,
            payload TEXT NOT NULL,
            created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO backup_fixture (id, payload)
          VALUES (1, 'preserve-existing-record'), (2, 'unicode-越南語-學生管理');
          CREATE INDEX backup_fixture_payload_idx ON backup_fixture (payload);
          SQL
      - name: Create and validate backup using the production script
        env:
          PGPASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: backup_restore_source
          DB_USER: postgres
          BACKUP_DIR: ${{ runner.temp }}/student-manager-backups
        run: |
          bash students_managerment-api/scripts/backup-postgres.sh
          cd "$BACKUP_DIR"
          archive="$(find . -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$archive"
          sha256sum -c "$(basename "$archive").sha256"
          pg_restore --list "$archive" >/dev/null
          echo "BACKUP_ARCHIVE=$BACKUP_DIR/${archive#./}" >> "$GITHUB_ENV"
      - name: Restore into a separate disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE backup_restore_target;"
          pg_restore --host=localhost --port=5432 --username=postgres \
            --dbname=backup_restore_target --exit-on-error --no-owner --no-acl "$BACKUP_ARCHIVE"
          restored_rows="$(psql -h localhost -U postgres -d backup_restore_target -Atc "SELECT count(*) FROM backup_fixture;")"
          test "$restored_rows" = "2"
          restored_payload="$(psql -h localhost -U postgres -d backup_restore_target -Atc "SELECT payload FROM backup_fixture WHERE id = 1;")"
          test "$restored_payload" = "preserve-existing-record"
          restored_index="$(psql -h localhost -U postgres -d backup_restore_target -Atc "SELECT count(*) FROM pg_indexes WHERE indexname = 'backup_fixture_payload_idx';")"
          test "$restored_index" = "1"
          echo "Isolated restore verified: rows=$restored_rows, index=$restored_index"

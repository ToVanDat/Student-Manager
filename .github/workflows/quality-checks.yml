name: Quality checks

on:
  push:
    branches:
      - feature/chat-1to1-complete
      - feature/e2ee-foundation
      - feature/progressive-password-cooldown
  pull_request:
    branches:
      - main
      - feature/chat-1to1-complete
      - feature/e2ee-foundation
      - feature/student-roster-csv-export
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students_managerment-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Linux sharp runtime omitted from the cross-platform lockfile
        run: npm install --no-save --package-lock=false --include=optional sharp@0.34.5
      - name: Run backend test suite
        run: npm test

  frontend-quality:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students_management-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run Signal Protocol encryption/decryption round-trip
        run: npm run test:e2ee
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build

  face-landmark-tests:
    name: Face landmark service tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students_managerment-api/face-landmark-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: students_managerment-api/face-landmark-service/requirements.txt
      - name: Install pinned landmark-service dependencies
        run: python -m pip install -r requirements.txt
      - name: Run landmark extraction unit tests
        run: python -m unittest -v test_landmarks.py

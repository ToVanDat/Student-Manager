services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-management-backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      # Set TRUST_PROXY_HOPS=1 only when this API is reachable exclusively through one trusted reverse proxy.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_RATE_LIMIT_HASH_SECRET: ${AUTH_RATE_LIMIT_HASH_SECRET:?Set AUTH_RATE_LIMIT_HASH_SECRET in students_managerment-api/.env}
      STUN_URIS: ${STUN_URIS:-}
      TURN_URIS: ${TURN_URIS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-86400}
      FACE_LANDMARK_SERVICE_URL: ${FACE_LANDMARK_SERVICE_URL:-http://face-landmark:3010}
      # Permit HTTP only across Compose's private bridge network; the service is not published to the host.
      FACE_LANDMARK_SERVICE_ALLOW_PRIVATE_HTTP: "true"
      FACE_LANDMARK_SERVICE_TOKEN: ${FACE_LANDMARK_SERVICE_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:5173,http://127.0.0.1:5173,https://student-manager.local}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Ollama runs on the Windows host; opt in only to Docker Desktop's host gateway.
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_ALLOW_DOCKER_HOST: ${OLLAMA_ALLOW_DOCKER_HOST:-true}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  face-landmark:
    profiles: ["face-login"]
    build:
      context: ./face-landmark-service
      dockerfile: Dockerfile
    container_name: student-management-face-landmark
    environment:
      FACE_LANDMARK_SERVICE_TOKEN: ${FACE_LANDMARK_SERVICE_TOKEN:-}
      FACE_LANDMARK_MODEL: /app/models/face_landmarker.task
    volumes:
      # Model binary is downloaded and SHA-256 verified separately; do not commit it.
      - ./face-landmark-service/models:/app/models:ro
    expose:
      - "3010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:3010/health',headers={'Authorization':'Bearer '+os.environ.get('FACE_LANDMARK_SERVICE_TOKEN','')}); urllib.request.urlopen(req,timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid

  postgres:
    image: postgres:18
    container_name: student-management-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ stores PGDATA under /var/lib/postgresql/<major>/docker.
      # Mount the parent directory, not the legacy /var/lib/postgresql/data path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: student-management-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
